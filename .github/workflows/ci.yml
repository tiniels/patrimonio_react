name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
  REDOCLY_TELEMETRY: "off"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate environment contract
        run: npm run check:env

      - name: Scan repository for sensitive material
        run: npm run check:secrets

      - name: Install frozen dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Run automated tests
        run: npm test

      - name: TypeScript strict check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier diagnostic
        run: |
          npx prettier --write src/lib/authStore.ts src/routes/_app.adm.buscas.tsx
          git diff -- src/lib/authStore.ts src/routes/_app.adm.buscas.tsx
          test -z "$(git status --porcelain -- src/lib/authStore.ts src/routes/_app.adm.buscas.tsx)"

      - name: Validate OpenAPI contract
        run: npm run check:openapi

      - name: Production build
        run: npm run build
